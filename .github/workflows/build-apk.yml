name: Build Standalone Offline APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android NDK & Environment Flags
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> android/local.properties

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Ensure Directory
        run: |
          npm run build || true
          mkdir -p dist www build
          if [ ! -f dist/index.html ] && [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Aikeya</title></head><body><div id="app"></div></body></html>' > dist/index.html
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Aikeya</title></head><body><div id="app"></div></body></html>' > www/index.html
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aikeya-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
