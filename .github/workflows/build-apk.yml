name: Build Standalone Offline APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Java Version
        run: |
          java -version
          javac -version

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets & Sync
        run: |
          mkdir -p build dist www
          HTML='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Aikeya</title></head><body><div id="app"></div></body></html>'
          [ -f build/index.html ] || echo "$HTML" > build/index.html
          [ -f dist/index.html ] || echo "$HTML" > dist/index.html
          [ -f www/index.html ] || echo "$HTML" > www/index.html
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aikeya-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
