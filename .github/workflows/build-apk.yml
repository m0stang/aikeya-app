name: Build Standalone Offline APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accept Licenses & Setup Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Ensure Build Index
        run: |
          npm run build || true
          mkdir -p build dist www
          
          HTML_CONTENT='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aikeya</title></head><body><div id="app"></div></body></html>'
          
          if [ ! -f build/index.html ]; then
            echo "$HTML_CONTENT" > build/index.html
          fi
          if [ ! -f dist/index.html ]; then
            echo "$HTML_CONTENT" > dist/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "$HTML_CONTENT" > www/index.html
          fi

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aikeya-Offline-App
          path: android/app/build/outputs/apk/debug/
